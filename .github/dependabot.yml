version: 2

updates:
  # garminconnect is the fragile dependency: it wraps an API nobody publishes a
  # contract for. Seeing its releases early is worth the noise, and
  # `make contract` runs on every PR, so a breaking bump fails loudly here
  # rather than silently at 03:00 on the Pi.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["type:task", "deps", "agent:ready"]
    commit-message:
      prefix: "deps"
    groups:
      # One PR for the routine churn. Individual PRs are reserved for the
      # dependencies that can actually break the build.
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Every actions bump touches .github/, so every one is tier 3 and costs a
    # line-by-line read. Six arriving at once is how a review queue stops being
    # read at all. The limit was missing here and the first run opened ten PRs.
    open-pull-requests-limit: 3
    labels: ["type:task", "deps", "agent:ready"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["type:task", "deps"]
    commit-message:
      prefix: "docker"
    ignore:
      # CI tests 3.12 and 3.13 only, so any other minor ships a Python that
      # nothing in the pipeline has ever run — and the image has never been
      # built at all (#4). garminconnect reaches Garmin through curl_cffi,
      # whose arm64 wheels for a new Python are the thing most likely to be
      # missing, and the failure would land on the Pi rather than in CI.
      #
      # Patch updates still arrive, so security fixes are not blocked. Lifting
      # this means widening the CI matrix first, in the same PR.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
