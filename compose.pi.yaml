# Raspberry Pi stack. See deploy/RASPBERRY_PI.md for the full procedure.
#
# One database, one serving layer, one ingestion worker per vendor. Wahoo slots
# in beside garmin-sync when its OAuth approval lands; nothing else changes.
#
# No service publishes a port. The only way in is the Cloudflare Tunnel, which
# dials out from the Pi — so the Pi needs no inbound firewall rule, no port
# forward, and no public IP.

name: soma

services:
  # The MCP server. Reads the database and writes nutrition and body entries;
  # it never contacts a vendor.
  # Schema and data migrations. Runs to completion before anything else opens
  # the database — three services share one SQLite file and watchtower restarts
  # them together, so migrating on application startup would race with itself.
  # It backs the database up first; see soma/migrate.py.
  migrate:
    image: ${SOMA_IMAGE:-ghcr.io/aidiaz/soma:latest}
    build: .
    container_name: soma-migrate
    command: ["soma-migrate"]
    env_file: [.env]
    environment:
      SOMA_DB_PATH: /app/data/soma.db
      TZ: ${SOMA_TIMEZONE:-UTC}
    volumes:
      - soma-data:/app/data
    restart: "no"

  server:
    image: ${SOMA_IMAGE:-ghcr.io/aidiaz/soma:latest}
    build: .
    container_name: soma-server
    env_file: [.env]
    environment:
      # Bind all interfaces so cloudflared can reach it over the compose
      # network. Still not reachable from outside the Pi — no port is published.
      SOMA_HOST: 0.0.0.0
      SOMA_DB_PATH: /app/data/soma.db
      SOMA_GARMIN_TOKENSTORE: /app/data/garmin_tokens
      # SOMA_TIMEZONE decides the join key (see soma.clock); this only sets
      # what the container's own clock and log timestamps read as. Kept in step
      # deliberately — reading a log in one zone while rows land in another is
      # how an off-by-one day goes unnoticed.
      TZ: ${SOMA_TIMEZONE:-UTC}
    ports:
      # Bound to 127.0.0.1 on purpose. A bare `8181:8000` publishes on every
      # interface, which on a home network means anyone on the wifi reaches the
      # server directly and bypasses Cloudflare, the Google sign-in and the
      # allowlist. The loopback prefix is the whole security property.
      - "127.0.0.1:8181:8000"
    volumes:
      - soma-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Garmin ingestion — the fragile source, isolated so that when it breaks,
  # nothing else stops. It is the only source for sleep, HRV, Body Battery and
  # resting HR.
  garmin-sync:
    image: ${SOMA_IMAGE:-ghcr.io/aidiaz/soma:latest}
    build: .
    container_name: soma-garmin-sync
    env_file: [.env]
    environment:
      SOMA_DB_PATH: /app/data/soma.db
      SOMA_GARMIN_TOKENSTORE: /app/data/garmin_tokens
      TZ: ${SOMA_TIMEZONE:-UTC}
    volumes:
      - soma-data:/app/data
    # Compose has no scheduler, so the loop is the schedule. It wakes at a fixed
    # local hour rather than every N seconds, because `sleep 86400` is not a
    # daily schedule: it starts wherever the container happened to start, slips
    # forward by each run's own duration, and moves an hour at every DST change.
    # Recomputing the next 08:00 from the clock each pass fixes all three, and
    # costs one `date` call. The hour is read in TZ, which is SOMA_TIMEZONE —
    # the same zone that decides the join key, so "the 08:00 run" and "today"
    # can never disagree about which day they mean.
    #
    # 08:00 is chosen for the data, not for tidiness. Garmin only finalises a
    # night's sleep and HRV after waking, so the morning is the first moment the
    # day's most valuable signals exist to be fetched. --skip-existing keeps
    # each run cheap: only the last couple of days are re-fetched.
    #
    # It also syncs once on start, so a deploy is verifiable immediately rather
    # than at the next 08:00 — and so a broken deploy fails loudly now.
    #
    # A failed run must not end the loop: expired tokens and Garmin 429s are both
    # recoverable, and a dead container would stop the retries that fix them. But
    # swallowing the exit code with a bare `|| true` once hid a "command not
    # found" through a whole deploy, so the failure is logged with its code. A
    # run that fails every cycle is then visible in `docker compose logs`.
    command:
      - sh
      - -c
      - |
        at="${SOMA_GARMIN_SYNC_AT:-08:00}"
        while true; do
          garmin-sync --skip-existing || echo "garmin-sync FAILED (exit $$?) — retrying next cycle"
          now=$$(date +%s)
          next=$$(date -d "$$at" +%s)
          # Strictly in the future: finishing at 07:59 must still wait for today,
          # and finishing exactly at 08:00 must not sleep zero and run twice.
          [ "$$next" -le "$$now" ] && next=$$(date -d "tomorrow $$at" +%s)
          echo "next garmin-sync at $$(date -d @$$next)"
          sleep $$((next - now))
        done
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

  # Wahoo ingestion — the source of truth for virtual and trainer rides. Garmin
  # records none of them (a 15-day Garmin sync returned zero activities while
  # Wahoo held the same period's riding), so this is where training load comes
  # from, not a refinement of it. See issue #3.
  wahoo-sync:
    image: ${SOMA_IMAGE:-ghcr.io/aidiaz/soma:latest}
    build: .
    container_name: soma-wahoo-sync
    env_file: [.env]
    environment:
      SOMA_DB_PATH: /app/data/soma.db
      SOMA_WAHOO_TOKENSTORE: /app/data/wahoo_tokens.json
      TZ: ${SOMA_TIMEZONE:-UTC}
    volumes:
      - soma-data:/app/data
    # Hourly rather than daily: a trainer session should be readable the evening
    # it happens, and Wahoo's access token lasts two hours, so a long gap means
    # every run starts by refreshing. Same failure handling as garmin-sync — the
    # exit code is logged rather than swallowed, so a run that fails every cycle
    # is visible in `docker compose logs`.
    command:
      - sh
      - -c
      - 'while true; do wahoo-sync || echo "wahoo-sync FAILED (exit $?) — retrying next cycle"; sleep "${SOMA_WAHOO_INTERVAL_S:-3600}"; done'
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

  # Token-based tunnel. Create it in the Cloudflare Zero Trust dashboard, route
  # the public hostname to http://server:8000, and put the token in .env.
  #
  # Do NOT add a Cloudflare Access policy to this hostname. MCP OAuth discovery
  # (/.well-known/*) and dynamic client registration (/register) must answer
  # without a login; Access replies to them with an HTML login page and the
  # client fails before the OAuth flow starts.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: soma-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

  # Optional: polls ghcr and restarts on a new image. Opt in with
  #   docker compose -f compose.pi.yaml --profile autoupdate up -d
  # This is a stopgap, not a deploy flow — no logs in Actions, no approval step,
  # no rollback. See deploy/RASPBERRY_PI.md.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: soma-watchtower
    profiles: [autoupdate]
    command: --interval 3600 --cleanup soma-server soma-garmin-sync
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  soma-data:
